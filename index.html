<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lode Runner – JS rekonstrukció</title><link rel="stylesheet" href="style.css"></head><body><main><canvas id="screen" width="320" height="200" aria-label="Lode Runner játék"></canvas><div class="controls"><label style="display:inline-block;padding:10px;border:1px solid #888">Eredeti pályák betöltése (D64): <input id="disk" type="file" accept=".d64"></label><button id="start">Indítás / újrakezdés</button><button id="pause">Szünet</button><button id="leftdig">Ásás balra (Z)</button><button id="rightdig">Ásás jobbra (X)</button></div><p>Nyilak / WASD: mozgás · Z/X: ásás · P: szünet · R: újrakezdés</p><p class="note">Szerkeszthető JavaScript-rekonstrukció; a pályák és a karakterek jelenleg kézzel készített közelítések, nem az eredeti D64-ből visszafejtett adatok.</p></main><script src="game.js"></script></body></html>
